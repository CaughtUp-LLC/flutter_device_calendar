android.enableJetifier=true
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin incremental cache cannot record Pub-cache sources that live on a
# different drive than the project (Windows: PUB_CACHE on C:, repo on D:).
# toRelativeString() then throws 'this and base files have different roots'
# and the build fails at :flutter_timezone:compileDebugKotlin. Disable incremental
# compilation so the example app builds on such checkouts.
kotlin.incremental=false
